#
# Target definition for MAST archive polling (sourced by lrd_ingest.sh).
# Coordinates are Image A of Abell 2744-QSO1 exactly as printed (sexagesimal) in
# Table 1 of Furtak, L. J., Zitrin, A., Plat, A., et al. 2023, ApJ 952, 142,
# "JWST UNCOVER: Extremely Red and Compact Object at z_phot ~ 7.6 Triply Imaged by A2744",
# DOI 10.3847/1538-4357/acdc9d, arXiv:2212.10531 (v4).
#   Image A (8296)  R.A. 00:14:19.161  Dec. -30:24:05.664
# Furtak et al. 2024, Nature 628, 57 (DOI 10.1038/s41586-024-07184-8, arXiv:2308.05735)
# presents the UNCOVER NIRSpec prism spectrum (JWST GO-2561) and refers to the
# 2023 paper for the image positions.
TARGET_NAME="Abell2744-QSO1 image A"
TARGET_RA_SEX="00:14:19.161"
TARGET_DEC_SEX="-30:24:05.664"
# Decimal degrees converted from the sexagesimal values above by
# ingest/lrd_ingest.sh (awk): RA = 15*(h + m/60 + s/3600), Dec = -(d + m/60 + s/3600).
CONE_RADIUS_DEG="0.0006"
# Selection: public, calibrated level-3 NIRSpec MSA source-level spectra from the
# UNCOVER program (GO-2561); the earliest epoch is the Furtak et al. 2024 data set.
SEL_COLLECTION="JWST"
SEL_INSTRUMENT="NIRSPEC/MSA"
SEL_PROPOSAL="2561"
SEL_CALIB_LEVEL="3"
SEL_PRODUCT_SUBGROUP="X1D"
CITATION="Furtak L. J., Zitrin A., Plat A., et al. 2023, ApJ 952, 142, doi:10.3847/1538-4357/acdc9d, arXiv:2212.10531, Table 1 (Image A)"
CITATION_SPECTRUM="Furtak L. J., Labbe I., Zitrin A., et al. 2024, Nature 628, 57, doi:10.1038/s41586-024-07184-8, arXiv:2308.05735"
